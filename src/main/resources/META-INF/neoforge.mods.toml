modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
# 1.21.1 起扩展原版枚举（RecipeBookType / RecipeBookCategories）必须走这份声明
enumExtensions="META-INF/enumextensions.json"
logoFile="torchesbecomesunlight.png"
authors="free fish,浩古散人,塞戮尔seymour,生活不易蒂蒂叹气，NH37,罗德岛神经工程学博士,薯饼不好次,啦啦啦丢失的狗"
description='''
This mod is based on "Arknights" and adds powerful bosses, various items, and partners to fight alongside you.
'''

[[mixins]]
config="torchesbecomesunlight.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},)"
    ordering="BEFORE"
    side="BOTH"

# RosmontisLib 的版本号带 -port.1 限定符，写死下界会被 maven 版本比较判为更小，
# 故不约束具体版本，仅声明为必需依赖。
[[dependencies.${mod_id}]]
    modId="rosmontislib"
    type="required"
    ordering="BEFORE"
    side="BOTH"
