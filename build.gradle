plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mapping_version
    }

    // NeoForge 的 AT 使用 Mojang 官方映射名，不再是 SRG（f_109472_ 之类）
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    // Mixin 由 NeoForge 内置支持：配置在 neoforge.mods.toml 的 [[mixins]] 中声明，
    // 不再需要 mixin gradle 插件、-mixin.config 启动参数或 MixinConfigs manifest 属性。
    // Mojang 映射下也不需要 refmap 重映射。

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // RosmontisLib 没有公开 maven 坐标，直接用 libs/ 下的 jar
    flatDir {
        dirs 'libs'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // 本地 jar：libs/rosmontislib-neoforge-1.21.1-0.5.0-port.1.jar
    // flatDir 坐标为 :<name>:<version>，Gradle 拼成 <name>-<version>.jar
    implementation ":rosmontislib-neoforge:${rosmontislib_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // MixinExtras 已由 NeoForge 21.1 内置提供，不再需要单独引入或 jarJar。

    // TODO(移植): 移植目标环境使用 Sodium，且不含 Oculus/Iris 或 Xenon。
    //   原 1.20.1 的 compat 依赖需要重新决策：
    //     implementation fg.deobf("curse.maven:xenon-564239:5216360")
    //     implementation fg.deobf("curse.maven:oculus-581495:5299671")
    //   compat/oculus/ForgeOculusHandle 与 TorchesBecomeSunlight.isUsingShaderPack()
    //   目前直接引用 Oculus API，在剥离或改接 Iris 之前会编译失败。

    // TODO(移植): 原开发期运行时依赖（mob-battle-mod / eeeabs-mobs / neat）的
    //   1.20.1 文件 ID 已失效，需要时再补 1.21.1 版本。
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version          : neo_version,
            neo_version_range    : neo_version_range,
            loader_version_range : loader_version_range,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            geckolib_version     : geckolib_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 移植期：放开 javac 错误条数上限，便于一次性统计剩余工作量
    options.compilerArgs << '-Xmaxerrs' << '100000'
}
