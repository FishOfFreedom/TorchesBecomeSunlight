# -Duser.language=en：让 javac 输出英文诊断，避免 Windows 中文控制台下的 GBK 乱码
org.gradle.jvmargs=-Xmx4G -Duser.language=en -Duser.country=US
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# NeoForge 1.21.1 需要 Java 21 运行 Gradle 本身（ModDevGradle 的 NeoForm 运行时要求）。
# 若 JAVA_HOME 未指向 JDK 21，取消下面这行的注释并填入本机 JDK 21 路径：
#org.gradle.java.home=/path/to/jdk-21

## 平台版本
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# 锁定 21.1.242；RosmontisLib port 也要求 [21.1.242,)
neo_version=21.1.242
neo_version_range=[21.1.242,)
loader_version_range=[4,)

## 映射
parchment_minecraft_version=1.21.1
parchment_mapping_version=2024.11.17

## 依赖版本
geckolib_version=4.9.2
jei_version=19.39.0.369
# RosmontisLib 无公开 maven 坐标，走 libs/ 下的本地 jar（见 build.gradle）
rosmontislib_version=1.21.1-0.5.0-port.1

## Mod 元数据
mod_id=torchesbecomesunlight
mod_name=Gathering Torches Become Sunlight
